version: "3.8"

services:
  # Next.js 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subtitle-translator-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DOCKER_BUILD=true
      - NEXT_PUBLIC_USE_LOCAL_API=false
      - NEXT_PUBLIC_SERVER_URL=http://server:3001
    depends_on:
      - server
    networks:
      - subtitle-network
    restart: unless-stopped

  # 独立服务端
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: subtitle-translator-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      # 缓存配置
      - CACHE_MAX_SIZE=1000
      - CACHE_MAX_AGE=3600000
      # 批量翻译配置
      - MAX_BATCH_SIZE=50
      - DEFAULT_BATCH_SIZE=20
      - MAX_CONCURRENT_REQUESTS=10
      # LLM 中转服务
      - LLM_RELAY_BASE=https://llm-proxy.aishort.top
      # 可选：代理配置
      # - HTTP_PROXY=http://proxy.example.com:8080
      # - HTTPS_PROXY=http://proxy.example.com:8080
      # - NO_PROXY=localhost,127.0.0.1
    volumes:
      # 挂载 .env 文件（如果需要本地环境变量）
      - ./server/.env:/app/.env:ro
    networks:
      - subtitle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  subtitle-network:
    driver: bridge