# 测试环境 Docker Compose 配置
# 使用示例: docker-compose -f docker-compose.test.yml up -d
services:
  # 独立服务端
  server:
    image: subtitle-translator-server:test-1aeef54
    container_name: subtitle-translator-server-test
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      # 缓存配置
      - CACHE_MAX_SIZE=5000
      - CACHE_MAX_AGE=7200000
      # 批量翻译配置
      - MAX_BATCH_SIZE=100
      - DEFAULT_BATCH_SIZE=30
      - MAX_CONCURRENT_REQUESTS=20
      # LLM 中转服务
      - LLM_RELAY_BASE=https://llm-proxy.aishort.top
      # 代理配置（如需要，请取消注释并修改）
      # - HTTP_PROXY=http://host.docker.internal:7890
      # - HTTPS_PROXY=http://host.docker.internal:7890
      # - NO_PROXY=localhost,127.0.0.1
      # API 密钥（请根据需要设置）
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    networks:
      - test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

networks:
  test-network:
    driver: bridge
    name: subtitle-test-network
